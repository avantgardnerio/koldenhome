# 2026-11-04: harden koldenhome (Node security release pre-alert, HIGH, due 2026-11-11).
# Goal: code execution inside Node can't reach ~ (SSH keys, password manager, GitHub creds)
# or write anywhere but the Z-Wave cache. Revert = delete this file + daemon-reload + restart.
[Service]
# No JIT: removes V8's riskiest attack surface. Breaks WebAssembly, so global fetch() fails
# (its HTTP parser is wasm) — use the https module instead (see plugins/sprinkler.js).
ExecStart=
ExecStart=/snap/node/current/bin/node --jitless index.js
# Kernel-enforced W^X. Only works *because* of --jitless (a JIT node aborts under it), so
# if --jitless is ever dropped the service fails loudly instead of silently re-enabling the JIT.
MemoryDenyWriteExecute=yes

NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
ProtectSystem=strict
ReadWritePaths=/workspace/koldenhome/cache
ProtectHome=yes
PrivateTmp=yes
UMask=0077

# Z-Wave stick only (ttyACM). Not PrivateDevices — that would hide it.
DevicePolicy=closed
DeviceAllow=char-ttyACM rw

ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RemoveIPC=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
SystemCallArchitectures=native
SystemCallFilter=@system-service
