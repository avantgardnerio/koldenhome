# 2026-11-04: extra hardening on top of the unit's own block.
# go2rtc only pulls RTSP (no ffmpeg/exec sources), so none of this restricts it.
# Revert = delete this file + daemon-reload + restart.
[Service]
# MemoryDenyWriteExecute: NOT set — the release binary is UPX-packed and unpacks itself
# into W+X memory (SEGV at start, verified 2026-11-04). Would work after `upx -d`.
CapabilityBoundingSet=
AmbientCapabilities=
ProtectKernelLogs=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid
RemoveIPC=yes
UMask=0077
# NETLINK: WebRTC enumerates local interfaces for ICE candidates
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
